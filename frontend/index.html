<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>spendyFRD</title>
  <meta name="description" content="Upload any bank or UPI statement and see your spending sorted into categories.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply saved theme before paint to avoid a flash.
    try { const th = localStorage.getItem("spendyfrd_theme"); if (th) document.documentElement.dataset.theme = th; } catch (_) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">₹</span>
        <div>
          <div class="brand-name">spendyFRD</div>
          <div class="brand-tag" data-i18n="tagline">Your money, sorted</div>
        </div>
      </div>
      <div class="topbar-actions">
        <select id="langSelect" class="lang-select" data-i18n-aria="language">
          <option value="en">English</option>
          <option value="te">తెలుగు</option>
          <option value="hi">हिन्दी</option>
        </select>
        <button id="themeBtn" class="icon-btn" type="button" data-i18n-aria="toggleTheme">
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- 1. Input -->
    <section class="card input-card">
      <label id="dropZone" class="dropzone" for="fileInput">
        <svg class="drop-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        <span class="drop-title" data-i18n="dropTitle">Drop your statement here</span>
        <span class="drop-sub"><span data-i18n="dropOr">or</span> <span class="link" data-i18n="browse">Choose files</span></span>
        <span class="drop-hint" data-i18n="dropHint">PDF, CSV, Excel, JSON, TXT or image</span>
        <input id="fileInput" type="file" multiple hidden
               accept=".pdf,.csv,.tsv,.txt,.xlsx,.xlsm,.json,.png,.jpg,.jpeg,.webp">
      </label>
      <ul id="uploadResults" class="upload-results" aria-live="polite"></ul>

      <div class="entry-row">
        <button id="addEntryBtn" class="btn btn-secondary" type="button" aria-expanded="false" aria-controls="entryForm">
          <span aria-hidden="true">+</span> <span data-i18n="addEntry">Add entry</span>
        </button>
        <span class="privacy" data-i18n="privacyNote">Your data stays on this computer.</span>
      </div>

      <form id="entryForm" class="entry-form" hidden novalidate>
        <div class="seg" role="radiogroup">
          <label><input type="radio" name="type" value="debit" checked><span data-i18n="spent">Spent</span></label>
          <label><input type="radio" name="type" value="credit"><span data-i18n="income">Income</span></label>
        </div>
        <label class="field grow">
          <span data-i18n="colDescription">Description</span>
          <input name="description" type="text" maxlength="200" required data-i18n-placeholder="descPlaceholder">
        </label>
        <label class="field">
          <span data-i18n="amountLabel">Amount (₹)</span>
          <input name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required>
        </label>
        <label class="field">
          <span data-i18n="colDate">Date</span>
          <input name="date" type="date">
        </label>
        <label class="field">
          <span data-i18n="colCategory">Category</span>
          <select name="category" id="entryCategory"></select>
        </label>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit" data-i18n="save">Save</button>
          <button class="btn btn-ghost" type="button" id="cancelEntryBtn" data-i18n="cancel">Cancel</button>
        </div>
      </form>
    </section>

    <!-- 2. Summary -->
    <section id="summarySection" class="summary" hidden>
      <div class="stat">
        <span class="stat-label" data-i18n="income">Income</span>
        <span class="stat-value pos" id="statIncome">₹0</span>
      </div>
      <div class="stat">
        <span class="stat-label" data-i18n="spent">Spent</span>
        <span class="stat-value neg" id="statSpent">₹0</span>
      </div>
      <div class="stat">
        <span class="stat-label" data-i18n="balance">Balance</span>
        <span class="stat-value" id="statBalance">₹0</span>
        <span class="stat-note" id="statNote"></span>
      </div>
    </section>

    <section id="categorySection" class="card" hidden>
      <div class="card-head">
        <h2 data-i18n="whereMoneyWent">Where your money went</h2>
        <p class="muted" data-i18n="clickToFilter">Click a category to filter the list</p>
      </div>
      <ul id="categoryBars" class="bars"></ul>
    </section>

    <!-- 3. Transactions -->
    <section class="card">
      <div class="card-head row">
        <h2><span data-i18n="transactions">Transactions</span> <span id="txCount" class="count"></span></h2>
        <div class="actions">
          <button id="pdfBtn" class="btn btn-secondary btn-sm" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>
            <span data-i18n="downloadPdf">PDF report</span>
          </button>
          <button id="csvBtn" class="btn btn-ghost btn-sm" type="button" data-i18n="exportCsv">CSV</button>
          <button id="clearBtn" class="btn btn-ghost btn-sm danger" type="button" data-i18n="clearAll">Clear all</button>
        </div>
      </div>

      <div class="toolbar">
        <input id="searchInput" class="search" type="search" data-i18n-placeholder="search" data-i18n-aria="search">
        <div class="seg seg-sm" id="typeFilter">
          <button type="button" data-type="" class="active" data-i18n="filterAll">All</button>
          <button type="button" data-type="debit" data-i18n="spent">Spent</button>
          <button type="button" data-type="credit" data-i18n="income">Income</button>
        </div>
        <button id="categoryChip" class="chip" type="button" hidden></button>
      </div>

      <div class="table-wrap">
        <table class="tx-table">
          <thead>
            <tr>
              <th class="col-date" data-i18n="colDate">Date</th>
              <th data-i18n="colDescription">Description</th>
              <th data-i18n="colCategory">Category</th>
              <th class="num" data-i18n="colAmount">Amount</th>
              <th><span class="sr-only" data-i18n="deleteRow">Delete</span></th>
            </tr>
          </thead>
          <tbody id="txBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty" hidden>
        <p class="empty-title" id="emptyTitle"></p>
        <p class="muted" id="emptyHint"></p>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toastText"></span>
    <button id="toastAction" type="button" hidden></button>
  </div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
